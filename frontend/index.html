<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PhishGuard AI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">


        <!-- THEME TOGGLE -->

        <button
            class="theme-toggle"
            id="themeToggle"
            onclick="toggleTheme()"
        >

            <span
                class="theme-icon"
                id="themeIcon"
            >
                ☀️
            </span>

            <span id="themeText">
                Light
            </span>

        </button>


        <!-- HEADER -->

        <div class="header">

            <div class="logo">
                🛡️
            </div>

            <div>

                <h1>
                    PhishGuard AI
                </h1>

                <p>
                    Explainable AI-Powered Phishing Detection
                </p>

            </div>

        </div>


        <!-- URL INPUT -->

        <div class="input-box">

            <input
                type="text"
                id="urlInput"
                placeholder="Enter website URL..."
                autocomplete="off"
            >

            <button onclick="analyzeURL()">
                🔍 Analyze URL
            </button>

        </div>


        <!-- RESULT -->

        <div
            class="result"
            id="result"
        >

            <div class="ready-icon">
                🛡️
            </div>

            <h2>
                Ready to Analyze
            </h2>

            <p>
                Enter a URL above to check whether it looks
                legitimate or suspicious.
            </p>

        </div>


        <!-- FOOTER -->

        <div class="footer">

            <span>
                🤖 Machine Learning
            </span>

            <span>
                🔎 Explainable Detection
            </span>

            <span>
                🛡️ Security Analysis
            </span>

        </div>


    </div>


<script>


// ==================================================
// THEME SYSTEM
// ==================================================

const themeIcon =
    document.getElementById("themeIcon");

const themeText =
    document.getElementById("themeText");


function applyTheme(theme) {

    if (theme === "light") {

        document.body.classList.add(
            "light-theme"
        );

        themeIcon.textContent = "🌙";

        themeText.textContent = "Dark";

    } else {

        document.body.classList.remove(
            "light-theme"
        );

        themeIcon.textContent = "☀️";

        themeText.textContent = "Light";

    }

}


function toggleTheme() {

    const isLight =
        document.body.classList.contains(
            "light-theme"
        );

    const newTheme =
        isLight ? "dark" : "light";

    localStorage.setItem(
        "phishguard-theme",
        newTheme
    );

    applyTheme(newTheme);

}


// Load saved theme

const savedTheme =
    localStorage.getItem(
        "phishguard-theme"
    );

applyTheme(
    savedTheme || "dark"
);


// ==================================================
// ANALYZE URL
// ==================================================

async function analyzeURL() {

    const input =
        document.getElementById(
            "urlInput"
        );

    const result =
        document.getElementById(
            "result"
        );

    const url =
        input.value.trim();


    if (url === "") {

        alert(
            "Please enter a URL."
        );

        return;

    }


    // Loading

    result.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            <h2>
                🔍 Analyzing URL...
            </h2>

            <p>
                PhishGuard AI is checking the URL.
            </p>

        </div>

    `;


    try {

        const response =
            await fetch(
                "http://127.0.0.1:8000/analyze",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        url: url
                    })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Backend returned an error"
            );

        }


        const data =
            await response.json();


        // ==================================================
        // RISK
        // ==================================================

        const risk =
            String(data.risk || "LOW").toUpperCase();

        const riskClass =
            risk.toLowerCase();


        let icon = "🟢";


        if (risk === "MEDIUM") {

            icon = "🟠";

        }


        if (risk === "HIGH") {

            icon = "🔴";

        }


        // ==================================================
        // SECURITY INDICATORS
        // ==================================================

        let indicators = [];


        if (
            data.security_analysis &&
            Array.isArray(
                data.security_analysis.indicators
            )
        ) {

            indicators =
                data.security_analysis.indicators;

        }


        let securityHTML = "";


        if (indicators.length > 0) {

            securityHTML = `

                <div class="security-analysis">

                    <div class="section-title">

                        <h3>
                            🛡️ Security Analysis
                        </h3>

                        <span>
                            ${indicators.length}
                            indicator${indicators.length === 1 ? "" : "s"}
                            detected
                        </span>

                    </div>


                    <div class="security-list">

                        ${indicators
                            .map(
                                indicator => `

                                    <div class="security-item">

                                        <span>
                                            ⚠️
                                        </span>

                                        <p>
                                            ${escapeHTML(indicator)}
                                        </p>

                                    </div>

                                `
                            )
                            .join("")
                        }

                    </div>

                </div>

            `;

        } else {

            securityHTML = `

                <div class="security-analysis safe">

                    <div class="section-title">

                        <h3>
                            🛡️ Security Analysis
                        </h3>

                        <span>
                            No suspicious indicators
                        </span>

                    </div>

                    <div class="security-safe">

                        ✓ No significant suspicious
                        URL patterns detected.

                    </div>

                </div>

            `;

        }


        // ==================================================
        // ML EXPLANATION
        // ==================================================

        const mlProbability =
            Number(
                data.phishing_probability || 0
            );


        let mlMessage =
            "The ML model found a low phishing probability based on the URL features.";


        if (mlProbability >= 70) {

            mlMessage =
                "The ML model detected a high phishing probability based on the URL features.";

        } else if (mlProbability >= 40) {

            mlMessage =
                "The ML model detected some suspicious URL characteristics.";

        }


        // ==================================================
        // OVERALL VERDICT
        //
        // IMPORTANT:
        // Use backend overall_verdict.
        // DO NOT use raw prediction here.
        // ==================================================

        const overallVerdict =
            data.overall_verdict ||
            (
                risk === "HIGH"
                    ? "PHISHING"
                    : risk === "MEDIUM"
                        ? "SUSPICIOUS"
                        : "LIKELY SAFE"
            );


        // ==================================================
        // RECOMMENDATION
        // ==================================================

        let recommendation;


        if (risk === "HIGH") {

            recommendation =
                "Avoid entering passwords, OTPs, payment details, or other sensitive information on this website.";

        } else if (risk === "MEDIUM") {

            recommendation =
                "Be cautious before entering personal information. Verify the website address and its source.";

        } else {

            recommendation =
                "The URL shows a low phishing risk based on the available analysis. Always verify the website before sharing sensitive information.";

        }


        // ==================================================
        // FINAL RESULT
        // ==================================================

        result.innerHTML = `

            <div class="result-header">

                <div>

                    <h2>
                        🛡️ Analysis Result
                    </h2>

                    <p class="url">
                        ${escapeHTML(data.url)}
                    </p>

                </div>


                <div class="risk-badge ${riskClass}">

                    ${icon}
                    ${risk}

                </div>

            </div>


            <!-- OVERALL SCORE -->

            <div class="score-section">

                <div class="score-number">

                    ${Number(data.score).toFixed(2)}%

                </div>

                <div class="score-label">

                    Overall Phishing Risk

                </div>


                <div class="progress">

                    <div
                        class="progress-bar ${riskClass}"
                        style="width: ${Math.min(
                            Number(data.score),
                            100
                        )}%"
                    ></div>

                </div>

            </div>


            <!-- AI ANALYSIS -->

            <div class="ai-analysis">

                <div class="section-title">

                    <h3>
                        🤖 AI Analysis
                    </h3>

                    <span>
                        Machine Learning
                    </span>

                </div>


                <div class="ai-card">

                    <div>

                        <span>
                            Phishing Probability
                        </span>

                        <strong>
                            ${Number(
                                data.phishing_probability
                            ).toFixed(2)}%
                        </strong>

                    </div>


                    <p>
                        ${mlMessage}
                    </p>

                </div>

            </div>


            <!-- SECURITY ANALYSIS -->

            ${securityHTML}


            <!-- DETAILS -->

            <div class="details">

                <div class="detail-card">

                    <span>
                        🔐 HTTPS
                    </span>

                    <strong>

                        ${
                            data.features &&
                            data.features.IsHTTPS === 1
                                ? "Yes"
                                : "No"
                        }

                    </strong>

                </div>


                <div class="detail-card">

                    <span>
                        🔎 Indicators
                    </span>

                    <strong>
                        ${indicators.length}
                    </strong>

                </div>


                <div class="detail-card">

                    <span>
                        🎯 Overall Verdict
                    </span>

                    <strong class="verdict-${riskClass}">
                        ${overallVerdict}
                    </strong>

                </div>

            </div>


            <!-- RECOMMENDATION -->

            <div class="recommendation">

                <h3>
                    💡 Recommendation
                </h3>

                <p>
                    ${recommendation}
                </p>

            </div>

        `;

    }


    catch (error) {

        console.error(error);


        result.innerHTML = `

            <div class="error">

                <div class="error-icon">
                    ❌
                </div>

                <h2>
                    Connection Error
                </h2>

                <p>
                    Could not connect to
                    PhishGuard AI backend.
                </p>

                <small>
                    Make sure Uvicorn is running
                    on port 8000.
                </small>

            </div>

        `;

    }

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ==================================================
// ENTER KEY
// ==================================================

document
    .getElementById("urlInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                analyzeURL();

            }

        }
    );

</script>


</body>

</html>
